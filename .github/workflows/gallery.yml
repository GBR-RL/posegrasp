name: Failure gallery

# Renders docs/media/failures.png from the results of a finished benchmark run (the benchmark's
# report job does the same for every new run).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Benchmark run whose results to use"
        required: true
      subset:
        description: "Images of that run"
        type: choice
        options: [all, dev]
        default: all

permissions:
  contents: read
  actions: read

jobs:
  gallery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          extras: plots
      - uses: actions/download-artifact@v5
        with:
          pattern: results-*
          path: results
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: posegrasp gallery --subset ${{ inputs.subset }} --out failures.png
      - uses: actions/upload-artifact@v5
        with:
          name: failure-gallery
          path: failures.png
