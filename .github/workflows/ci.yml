name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BOP_TOOLKIT_COMMIT: cea62d651c7e395b2e1962b9749e4e89693c6ac4

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python }}
          extras: dev,plots
          data: "false"
      # The official BOP toolkit, only for the metric cross-checks. Its pose_error module needs
      # numpy and scipy alone; --no-deps keeps its opencv-python from replacing opencv-contrib.
      - name: BOP toolkit (pinned)
        run: python -m pip install --no-deps "bop_toolkit_lib @ git+https://github.com/thodan/bop_toolkit.git@${BOP_TOOLKIT_COMMIT}"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (unit)
        run: pytest -m "not dataset"

  dataset:
    name: Tests on the real LM-O data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          extras: dev
      - run: posegrasp info
      - run: pytest -m dataset
