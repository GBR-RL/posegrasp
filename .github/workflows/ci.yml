name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BOP_TOOLKIT_COMMIT: cea62d651c7e395b2e1962b9749e4e89693c6ac4

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for Open3D
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libgomp1
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          # The official BOP toolkit, only for the metric cross-checks. Its pose_error module needs
          # numpy and scipy alone; --no-deps keeps its opencv-python from replacing opencv-contrib.
          python -m pip install --no-deps "bop_toolkit_lib @ git+https://github.com/thodan/bop_toolkit.git@${{ env.BOP_TOOLKIT_COMMIT }}"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (unit)
        run: pytest -m "not dataset"

  dataset:
    name: Tests on the real LM-O data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for Open3D
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libgomp1
      - run: python -m pip install -e ".[dev]"
      # ~140 MB from the BOP Hugging Face mirror, downloaded once and restored from the cache.
      - uses: actions/cache@v5
        with:
          path: data/raw
          key: lmo-bop19-v1
      - run: posegrasp data
      - run: posegrasp info
      - run: pytest -m dataset
